[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-ai-comsol-lab"
version = "0.1.0"
description = "Research toolkit connecting PyBaMM, COMSOL automation, battery experiments, AI surrogates and digital twins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "pybamm>=25.0",
]

[project.optional-dependencies]
comsol = ["MPh>=1.3"]
ml = [
  "scikit-learn>=1.5",
  "scipy>=1.13",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]
all = [
  "MPh>=1.3",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
battery-pybamm = "battery_lab.pybamm_baseline:main"
battery-sweep = "battery_lab.sweep:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]