project_id: battery-ai-comsol-lab
chemistry: graphite_NMC_LG_M50
cell_format: cylindrical
engine: pybamm
model: DFN
thermal: lumped
parameter_set: ORegan2022
protocol_id: constant_current_discharge
c_rate: 1.0
ambient_temperature_K: 298.15
initial_soc: 1.0
max_duration_s: 7200
output_points: 500
notes: >-
  Electro-thermal reference based on the upstream ORegan2022 LG M50 parameter
  set, which was developed for thermal-electrochemical modeling of a high-energy
  cylindrical lithium-ion cell. Use this as a reproducible reference, not as a
  substitute for parameters measured on the actual cell under study.
