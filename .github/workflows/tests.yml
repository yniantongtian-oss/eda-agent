name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Altium-specific bridge code needs Windows. Run the full suite on every
    # Python version advertised by pyproject.toml so the compatibility claim
    # is continuously verified instead of only being metadata.
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # fetch-depth: 0 brings the tags along. The default shallow fetch
      # brings none, and tests/test_version_is_unreleased.py compares the
      # declared version against the tags: with no tags it has nothing to
      # compare and passes vacuously. That would leave the one check that
      # catches a release number which has already shipped inert in CI,
      # which is the only place it runs unattended.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: DelphiScript lint
        run: python scripts/altium/lint.py

      - name: Pascal bundle consistency
        run: python scripts/altium/build.py

      # Free Pascal lets the cross-validation suite (tests/test_cross_validate.py)
      # actually run instead of self-skipping: it compiles the real Pascal
      # string/JSON/unit helpers with fpc and asserts byte-for-byte parity with
      # their Python mirrors. Without fpc on PATH those tests skip silently, so
      # a regression in a shared helper would pass CI unnoticed.
      - name: Install Free Pascal Compiler
        run: choco install freepascal --no-progress -y

      - name: Run test suite
        run: python -m pytest tests/ -q

  package:
    # A green editable install is not enough for a release. Build the actual
    # wheel + sdist, inspect their contents, install the wheel into a clean
    # venv, and exercise the shipped console entry point.
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install "build>=1.2,<2"

      - name: Build wheel and source distribution
        run: python -m build

      - name: Verify distribution contents and metadata
        run: python scripts/verify_distribution.py

      - name: Smoke-test installed wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist\*.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw "No wheel found in dist/" }

          python -m venv .venv-smoke
          .\.venv-smoke\Scripts\python.exe -m pip install $wheel
          .\.venv-smoke\Scripts\eda-agent.exe --version
          .\.venv-smoke\Scripts\eda-agent.exe --help | Out-Null

          $scriptsPath = & .\.venv-smoke\Scripts\eda-agent.exe scripts-path
          if (-not (Test-Path $scriptsPath)) {
            throw "Bundled Altium scripts path does not exist: $scriptsPath"
          }
