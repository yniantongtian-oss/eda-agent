name: battery-research-lab

on:
  push:
    paths:
      - "research/battery-ai-comsol-lab/**"
      - ".github/workflows/battery-research-lab.yml"
  pull_request:
    paths:
      - "research/battery-ai-comsol-lab/**"
      - ".github/workflows/battery-research-lab.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/battery-ai-comsol-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/battery-ai-comsol-lab/pyproject.toml
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest
